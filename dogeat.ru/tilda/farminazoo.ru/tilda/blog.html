        url: "/blog/trekhrazovoe-pitanie-shchenka",
        cover:
          "https://static.tildacdn.com/tild6537-3532-4436-a232-363939323939/pexels-brett-sayles-.jpg",

    var root = document.querySelector("[data-fa-blog]");
    if (!root) return;

    var searchNode = root.querySelector('[data-role="search"]');
    var statsNode = root.querySelector('[data-role="stats"]');
    var gridNode = root.querySelector('[data-role="grid"]');
    var emptyNode = root.querySelector('[data-role="empty"]');
    var paginationNode = root.querySelector('[data-role="pagination"]');

    var currentPage = 1;
    var searchValue = "";

    var posts = BLOG_POSTS.slice().sort(function (a, b) {
      return Number(b.id) - Number(a.id);
    });
    var filteredPosts = [];

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function readStateFromUrl() {
      var params = new URLSearchParams(window.location.search);
      var query = String(params.get("q") || "").trim();
      var page = Number(params.get("page"));

      if (!Number.isInteger(page) || page < 1) page = 1;

      return { query: query, page: page };
    }

    function normalizePost(post, index) {
      var id = Number(post.id) || index + 1;
      var padded = String(id).padStart(3, "0");

      return {
        title: post.title || "Заголовок поста " + padded,
        excerpt: post.excerpt || "Краткое описание статьи.",
        url: post.url || "#post-" + padded,
        cover: post.cover || "",
        coverAlt: post.coverAlt || "Обложка поста " + padded,
      };
    }

    posts = posts.map(normalizePost);
    filteredPosts = posts.slice();

    function getTotalPages(totalItems) {
      return Math.max(1, Math.ceil(totalItems / POSTS_PER_PAGE));
    }

    function applySearchFilter() {
      if (!searchValue) {
        filteredPosts = posts.slice();
        return;
      }

      var needle = searchValue.toLowerCase();
      filteredPosts = posts.filter(function (post) {
        var haystack = (post.title + " " + post.excerpt).toLowerCase();
        return haystack.indexOf(needle) !== -1;
      });
    }

    function updateUrlState() {
      var url = new URL(window.location.href);

      if (searchValue) url.searchParams.set("q", searchValue);
      else url.searchParams.delete("q");

      if (currentPage > 1) url.searchParams.set("page", String(currentPage));
      else url.searchParams.delete("page");

      var next =
        url.pathname +
        (url.searchParams.toString() ? "?" + url.searchParams.toString() : "") +
        url.hash;
      var current =
        window.location.pathname +
        window.location.search +
        window.location.hash;

      if (next !== current) {
        window.history.replaceState(null, "", next);
      }
    }

    function getPageTokens(totalPages, page) {
      if (totalPages <= 7) {
        return Array.from({ length: totalPages }, function (_, i) {
          return i + 1;
        });
      }

      var tokens = [1];
      var start = Math.max(2, page - 1);
      var end = Math.min(totalPages - 1, page + 1);

      if (start > 2) tokens.push("...");
      for (var p = start; p <= end; p += 1) tokens.push(p);
      if (end < totalPages - 1) tokens.push("...");

      tokens.push(totalPages);
      return tokens;
    }

    function renderCards(items) {
      gridNode.innerHTML = items
        .map(function (post, index) {
          var delay = Math.min(index, 11) * 65;
          var media = post.cover
            ? '<img class="fa-blog-widget__cover" src="' +
              escapeHtml(post.cover) +
              '" alt="' +
              escapeHtml(post.coverAlt) +
              '" loading="lazy" decoding="async" data-cover>'
            : '<div class="fa-blog-widget__cover fa-blog-widget__cover--placeholder">Изображение статьи</div>';

          return (
            '<article class="fa-blog-widget__card" style="--fa-card-delay: ' +
            delay +
            'ms">' +
            '<a class="fa-blog-widget__card-link" href="' +
            escapeHtml(post.url) +
            '">' +
            media +
            '<div class="fa-blog-widget__body">' +
            '<h2 class="fa-blog-widget__post-title">' +
            escapeHtml(post.title) +
            "</h2>" +
            '<p class="fa-blog-widget__excerpt">' +
            escapeHtml(post.excerpt) +
            "</p>" +
            "</div>" +
            "</a>" +
            "</article>"
          );
        })
        .join("");

      gridNode.querySelectorAll("img[data-cover]").forEach(function (imgNode) {
        imgNode.addEventListener(
          "error",
          function () {
            var placeholder = document.createElement("div");
            placeholder.className =
              "fa-blog-widget__cover fa-blog-widget__cover--placeholder";
            placeholder.textContent = "Изображение недоступно";
            imgNode.replaceWith(placeholder);
          },
          { once: true },
        );
      });
    }

    function renderPagination(totalPages) {
      var tokens = getPageTokens(totalPages, currentPage);
      var html = [];

      html.push(
        '<button class="fa-blog-widget__page-btn" type="button" data-page="' +
          (currentPage - 1) +
          '"' +
          (currentPage === 1 ? " disabled" : "") +
          ">Назад</button>",
      );

      tokens.forEach(function (token) {
        if (token === "...") {
          html.push('<span class="fa-blog-widget__ellipsis">...</span>');
          return;
        }

        html.push(
          '<button class="fa-blog-widget__page-btn' +
            (token === currentPage ? " is-active" : "") +
            '" type="button" data-page="' +
            token +
            '">' +
            token +
            "</button>",
        );
      });

      html.push(
        '<button class="fa-blog-widget__page-btn" type="button" data-page="' +
          (currentPage + 1) +
          '"' +
          (currentPage === totalPages ? " disabled" : "") +
          ">Вперед</button>",
      );

      paginationNode.innerHTML = html.join("");
    }

    function render(options) {
      var config = options || {};
      var total = filteredPosts.length;
      var totalPages = getTotalPages(total);
      if (currentPage > totalPages) currentPage = totalPages;

      var start = (currentPage - 1) * POSTS_PER_PAGE;
      var pageItems = filteredPosts.slice(start, start + POSTS_PER_PAGE);

      statsNode.textContent =
        "Найдено: " +
        total +
        " · Страница " +
        currentPage +
        " из " +
        totalPages;

      emptyNode.hidden = total !== 0;
      gridNode.hidden = total === 0;

      if (total === 0) {
        paginationNode.innerHTML = "";
        if (config.syncUrl !== false) updateUrlState();
        return;
      }

      renderCards(pageItems);
      renderPagination(totalPages);
      if (config.syncUrl !== false) updateUrlState();
    }

    searchNode.addEventListener("input", function (event) {
      searchValue = String(event.target.value || "").trim();
      currentPage = 1;
      applySearchFilter();
      render();
    });

    paginationNode.addEventListener("click", function (event) {
      var button = event.target.closest("[data-page]");
      if (!button || button.hasAttribute("disabled")) return;

      var nextPage = Number(button.getAttribute("data-page"));
      if (!Number.isInteger(nextPage)) return;

      var totalPages = getTotalPages(filteredPosts.length);
      if (nextPage < 1 || nextPage > totalPages) return;

      currentPage = nextPage;
      render();

      var offsetTop = root.getBoundingClientRect().top + window.scrollY - 24;
      window.scrollTo({ top: Math.max(0, offsetTop), behavior: "smooth" });
    });

    var state = readStateFromUrl();
    searchValue = state.query;
    currentPage = state.page;
    searchNode.value = searchValue;
    applySearchFilter();
    render({ syncUrl: false });
  })();
</script>
